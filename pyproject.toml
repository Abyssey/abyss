[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abyss-harness"
version = "0.1.0"
description = "2026.11 Claude Code Alignment & Multi-Agent Worktree Coding Harness (with DeepAgents & Qwen 3.8 Flash / Gemini / OpenAI Rotator)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "openai>=1.55.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.optional-dependencies]
deepagents = [
    "deepagents>=0.7.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["abyss*", "demo_workspace*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
